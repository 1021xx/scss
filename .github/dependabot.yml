version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/css-layout_*"
    schedule:
      interval: "weekly"
    # Keep this focused on known security issues, not routine version churn.
    open-pull-requests-limit: 0
    groups:
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
